[package]
name = "rtools"
version = "0.5.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
serde_json = { version = "1.0.150", features = ["preserve_order"] }
uuid = { version = "1", features = ["v1", "v3", "v4", "v5", "v6", "v7", "v8"] }
arboard = { version = "3", default-features = false }
chrono = "0.4.45"
qrcode = { version = "0.14", default-features = false }
terminal_size = "0.4"
chrono-humanize = "0.2"
crossterm = "0.29"
ureq = { version = "3.4.2", default-features = false, features = ["rustls", "platform-verifier", "win-system-proxy"] }
serde = { version = "1.0.229", features = ["derive"] }
semver = "1.0.28"
sha2 = "0.11.0"
tempfile = "3.27.0"
hmac = "0.13"
base64 = "0.23"
md-5 = "0.11"
sha1 = "0.11"
clap_complete = "4.6.11"
jiff = "0.2.37"

# Release archives are .tar.gz, except on Windows where they are .zip.
[target.'cfg(not(windows))'.dependencies]
flate2 = "1.1.10"
tar = { version = "0.4.46", default-features = false }

[target.'cfg(windows)'.dependencies]
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# Deletes the replaced .exe, which Windows keeps locked until rtools exits.
self-replace = "1.5.0"

[profile.release]
codegen-units = 1
lto = true
strip = true
