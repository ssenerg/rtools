[package]
name = "rtools"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
serde_json = { version = "1.0.150", features = ["preserve_order"] }
uuid = { version = "1", features = ["v1", "v3", "v4", "v5", "v6", "v7", "v8"] }
arboard = { version = "3", default-features = false }

[profile.release]
codegen-units = 1
lto = true
strip = true
